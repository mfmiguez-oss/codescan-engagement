name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest  # POSIX, non-root: a Windows-only gate hides POSIX bugs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # the vendored workspace is installed so the in-process end-to-end test
      # runs here rather than skipping: it is local and offline, so installing
      # it costs nothing and covers the adapter against the real recorders
      - run: python -m pip install -e ".[dev]" ./vendor/openhack
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q

  image:
    # The gate runs without the image by design, so nothing in it exercises what
    # is actually deployed. This is the job that would have caught a
    # control-plane container whose command was never installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"

      - name: Build
        run: docker build -f deploy/Dockerfile -t codescan-engagement:ci .

      - name: The CLI runs
        run: docker run --rm codescan-engagement:ci --help

      - name: The vendored workspace is usable
        run: |
          docker run --rm --entrypoint python codescan-engagement:ci -c "
          import os
          from pathlib import Path
          from openhack.paths import root
          from openhack.registry import load_experts
          # compare resolved paths, not strings: separators and symlinks differ
          assert root() == Path(os.environ['OPENHACK_ROOT']).resolve(), root()
          experts = load_experts()
          assert len(experts) >= 12, experts
          print(f'workspace root {root()} with {len(experts)} experts')
          "

      - name: The control plane can start
        run: |
          docker run --rm --entrypoint python \
            -e ENGAGEMENT_JWKS_URI=https://example.invalid/keys \
            -e ENGAGEMENT_ISSUER=https://example.invalid/v2.0 \
            -e ENGAGEMENT_API_AUDIENCE=api://engagement \
            codescan-engagement:ci -c "
          import uvicorn  # the command the Bicep template runs
          from engagement.asgi import app
          assert app is not None
          print('control plane importable')
          "

      # A full scan inside the image: recon, router, expert, triage, SARIF.
      # These tests skip without the image, so they only mean anything here.
      - name: End-to-end scan in the image
        run: pytest tests/test_e2e.py -q
