[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codescan-engagement"
version = "0.1.0"
description = "Unattended driver for scenario-first whitebox security review"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
# One extra per provider, each lazily imported. The base package installs with
# neither, and the offline path never touches the network.
foundry = ["httpx>=0.27"]
bedrock = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]
# The deterministic triage backbone is `engagement.backbone`, ported into this
# package rather than resolved from a private git reference. There is no
# `triage` extra any more: scoring, lifecycle, chains, PoC drafts and the
# worklist are available to every install, and the image is self-sufficient.
# `tests/test_backbone_conformance.py` holds the port to the original whenever
# `triagekit` happens to be installed beside it.
# The control plane: token verification and the HTTP surface.
api = ["pyjwt[crypto]>=2.8", "starlette>=0.37", "uvicorn>=0.30"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
engagement = "engagement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

# Provider and storage clients are lazily-imported optional extras; the offline
# environment deliberately does not install them.
[[tool.mypy.overrides]]
module = ["httpx", "boto3", "psycopg", "triagekit.*", "jwt", "jwt.*", "starlette.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# tests import sibling helpers (fakes.py) directly; that is a first-party
# import inside the test package, not third-party.
[tool.ruff.lint.isort]
known-first-party = ["engagement", "fakes"]
