[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhack"
version = "0.1.0"
description = "File-based, scenario-first workspace for source-guided whitebox security review."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8.0",
  "types-jsonschema",
]

[project.scripts]
openhack = "openhack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"

# Declared, not inherited. The dev extra pins ruff only as >=0.6, so CI
# resolves whatever is newest, and a default rule set is a moving target: 0.16
# reported 57 errors here that 0.15 did not, none of them from a code change.
# A gate that shifts when a tool is released is a statement about the machine
# rather than the repo, so the rules are named.
#
# These catch defects: pyflakes, the pycodestyle errors that are not
# formatting, import order, and bugbear. E501 and W are deliberately out --
# this code runs long lines on purpose, and reflowing 140 of them would be a
# style migration wearing a bug fix's clothes.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

# Scoped, not discovered. A workspace root holds `runs/<client>/<run>/sourcecode`
# — a checkout of the repository under review — and bare `pytest` collects any
# `*_test.py` in it. That is someone else's test suite, arbitrary code, and it
# already broke collection here on a vendored Go library's msgpack tests.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
